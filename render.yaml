services:
  - type: web
    name: jobfusion-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_NAME
        value: jobfusion
      - key: MONGODB_URI
        value: mongodb://localhost:27017
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@jobfusion.ai
      - key: ADMIN_PASSWORD
        value: AdminPassword123!
      - key: PYTHON_VERSION
        value: 3.11.9
