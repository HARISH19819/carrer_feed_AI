version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jobfusion-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobfusion-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=jobfusion
      - SECRET_KEY=jobfusion-super-secret-development-key-32chars
      - JWT_SECRET=jobfusion-jwt-secret-token-key-32chars
      - FRONTEND_URL=http://localhost:5173
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,*
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobfusion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
